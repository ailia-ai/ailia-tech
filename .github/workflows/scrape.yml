name: Daily scrape

on:
  schedule:
    # 毎日 01:00 UTC (= 10:00 JST) に実行
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "既存記事の再取得モード"
        required: true
        type: choice
        default: "updated"
        options:
          - "off"        # 新着のみ取得 (lastmod差分は無視)
          - "updated"    # Apollo latestPublishedAt が新しい記事だけ再取得 (cron既定)
          - "all"        # 全記事を強制的に再取得 (時間がかかる)
      only_url:
        description: "1記事だけ更新する場合の記事URL (medium.com)"
        required: false
        type: string
        default: ""
      lang:
        description: "対象言語 (空 = ja+en 両方)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - "ja"
          - "en"

permissions:
  contents: write
  pages: write
  id-token: write

# 同じ run の中で push 後の build/deploy まで完結させたいので、
# pages.yml と同じ concurrency group で deploy をシリアライズする。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install curl-cffi beautifulsoup4 markdownify

      - name: Scrape Medium
        run: |
          refresh_mode="${{ github.event.inputs.refresh }}"
          # cron実行時は inputs が空文字 → 既定値 "updated" 扱い
          # (Apollo の latestPublishedAt を比較して Medium で編集された記事を自動再取得)
          if [[ -z "${refresh_mode}" ]]; then
            refresh_mode="updated"
          fi

          flags=""
          case "${refresh_mode}" in
            updated) flags="--refresh" ;;
            all)     flags="--refresh-all" ;;
          esac

          only_url="${{ github.event.inputs.only_url }}"
          if [[ -n "${only_url}" ]]; then
            flags="${flags} --only-url ${only_url} --refresh"
          fi

          target_lang="${{ github.event.inputs.lang }}"

          run_one() {
            local lang="$1"
            local pub="$2"
            echo "::group::scrape $lang ($pub)"
            # urls.txt が残っているとキャッシュが再利用されるので毎回削除
            rm -f "medium_export/${lang}/urls.txt"
            python downloader/medium_publication.py \
              --publication "$pub" \
              --output "medium_export/${lang}" \
              ${flags}
            echo "::endgroup::"
          }

          if [[ -z "${target_lang}" || "${target_lang}" == "ja" ]]; then
            run_one ja axinc
          fi
          if [[ -z "${target_lang}" || "${target_lang}" == "en" ]]; then
            run_one en axinc-ai
          fi

      - name: Commit & push if there are new articles
        run: |
          if [[ -z "$(git status --porcelain medium_export/)" ]]; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medium_export/
          added=$(git diff --cached --name-status -- 'medium_export/*/articles/*.md' | grep -c '^A' || true)
          modified=$(git diff --cached --name-status -- 'medium_export/*/articles/*.md' | grep -c '^M' || true)
          if [[ "${added}" -gt 0 && "${modified}" -gt 0 ]]; then
            msg="Auto-scrape: ${added} new + ${modified} updated article(s) on $(date -u +%Y-%m-%d)"
          elif [[ "${added}" -gt 0 ]]; then
            msg="Auto-scrape: ${added} new article(s) on $(date -u +%Y-%m-%d)"
          else
            msg="Auto-scrape: ${modified} updated article(s) on $(date -u +%Y-%m-%d)"
          fi
          git commit -m "$msg"
          git push

  # GITHUB_TOKEN が push したコミットは別ワークフローを発火させないため、
  # pages.yml の build/deploy 相当をこの workflow 内で直接実行する。
  # scrape の commit が無くても (新着記事ゼロでも) main を再ビルドして
  # 取りこぼしを救済できるよう、scrape job の成否に関わらず実行する。
  build:
    needs: scrape
    if: ${{ always() && needs.scrape.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scrape job が push した最新コミットを取得するため
          # 起動時 SHA ではなく branch HEAD を明示的に指す。
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python downloader/build_site.py --source medium_export --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
