name: Daily scrape

on:
  schedule:
    # 毎日 01:00 UTC (= 10:00 JST) に実行
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install curl-cffi beautifulsoup4 markdownify

      - name: Scrape Medium
        # urls.txt が残っているとそのキャッシュが再利用され、新着URLが
        # sitemap から取り込まれなくなるため、毎回削除してから実行する。
        run: |
          rm -f medium_export/urls.txt
          python downloader/medium_publication.py \
            --publication axinc \
            --custom-domain tech.ailia.ai

      - name: Commit & push if there are new articles
        run: |
          if [[ -z "$(git status --porcelain medium_export/)" ]]; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medium_export/
          # 件数が分かるようにmd差分から取得
          added=$(git diff --cached --name-status -- 'medium_export/articles/*.md' | grep -c '^A' || true)
          msg="Auto-scrape: ${added} new article(s) on $(date -u +%Y-%m-%d)"
          git commit -m "$msg"
          git push
